# nginx gateway route for the docparse OCR service (nginx on the same machine).
#
# Paste these `location` blocks inside your existing `server { ... }` block,
# or save this file and add `include .../docparse.conf;` inside that block.
#
#   https://<gateway>/ocr/v1/parse  ->  http://127.0.0.1:8080/v1/parse
#   https://<gateway>/ocr/health    ->  http://127.0.0.1:8080/health

location /ocr/ {
    # The trailing "/" strips the /ocr prefix before forwarding
    proxy_pass http://127.0.0.1:8080/;

    # Uploads: must be at least DOCPARSE_MAX_UPLOAD_MB (50 MB)
    client_max_body_size 50m;
    client_body_timeout 120s;

    # OCR on CPU can take minutes for a large scanned PDF
    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The X-API-Key header is passed through unchanged
}

# /ocr without the trailing slash -> /ocr/
location = /ocr {
    return 301 /ocr/;
}
